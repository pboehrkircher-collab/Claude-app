<meta charset="utf-8">
<title>Bollos Reise</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
/* Layout: one full-screen stage, the 16:9 game canvas scaled to fit, touch pads float over its lower corners. Single dark arcade look on purpose. */
:root {
  --bg: #1b1530;
  --frame: #2b2140;
  --ink: #fff7e6;
  --pad: rgba(255, 247, 230, 0.16);
  --pad-active: rgba(255, 210, 63, 0.55);
  --pad-line: rgba(255, 247, 230, 0.55);
  --font: "Fredoka", "Trebuchet MS", "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  box-sizing: border-box;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}
#stage {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
#wrap { position: relative; }
canvas {
  display: block;
  border-radius: 14px;
  box-shadow: 0 0 0 4px var(--frame), 0 18px 50px rgba(0, 0, 0, 0.45);
  outline: none;
}
canvas:focus-visible { box-shadow: 0 0 0 4px #ffd23f, 0 18px 50px rgba(0, 0, 0, 0.45); }
#touch {
  position: absolute;
  inset: auto 0 0 0;
  display: flex;
  justify-content: space-between;
  padding: 10px;
  pointer-events: none;
}
#touch .pad { display: flex; gap: 16px; pointer-events: auto; }
#touch button {
  width: 109px;
  height: 109px;
  border-radius: 50%;
  border: 2px solid var(--pad-line);
  background: var(--pad);
  color: var(--ink);
  font: 700 38px var(--font);
  touch-action: none;
}
#touch button.on { background: var(--pad-active); }
#fs {
  position: absolute;
  left: 50%;
  bottom: 10px;
  transform: translateX(-50%);
  width: 44px;
  height: 44px;
  border-radius: 12px;
  border: 2px solid var(--pad-line);
  background: var(--pad);
  color: var(--ink);
  display: grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
}
#fs:hover, #fs:focus-visible { background: var(--pad-active); outline: none; }
#fs svg { width: 22px; height: 22px; }
body.full { padding: 0; }
body.full canvas { border-radius: 0; box-shadow: none; }
@media (max-height: 420px) { #touch button { width: 92px; height: 92px; font-size: 32px; } }
</style>

<div id="stage">
  <div id="wrap">
    <canvas id="game" tabindex="0" aria-label="Bollos Reise – Spielfeld"></canvas>
    <button id="fs" type="button" aria-label="Vollbild" title="Vollbild (F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path id="fs-icon" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <div id="touch" hidden>
      <div class="pad">
        <button id="btn-left" data-k="l" aria-label="Links">◀</button>
        <button id="btn-right" data-k="r" aria-label="Rechts">▶</button>
      </div>
      <div class="pad">
        <button id="btn-action" data-k="a" aria-label="Aktion">X</button>
        <button id="btn-jump" data-k="j" aria-label="Springen">▲</button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
// ---------- Grundwerte ----------
// W/VH: sichtbare Fläche passt sich dem Bildformat an, die Spielwelt ist immer 540 hoch.
let W = 960, VH = 540, TOP = 0, BOT = 0, portrait = false;
const H = 540, T = 45, ROWS = 12, FLOOR = 450;
const GRAV = 2200, JUMP = 820, SPEED = 310, SPRING = 1150;
const TAU = Math.PI * 2;
const INK = '#2b2140';
const FONT = '"Fredoka", "Trebuchet MS", "Segoe UI", sans-serif';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let scaleK = 1;
function resize() {
  const st = document.getElementById('stage').getBoundingClientRect();
  const aw = Math.max(1, st.width), ah = Math.max(1, st.height);
  portrait = aw < ah;
  const a = clamp(aw / ah, 4 / 3, 2.4);
  // Auf Touch-Geräten bekommt das Spielfeld unten einen Streifen, damit die großen Tasten die Figur nicht verdecken.
  BOT = 0;
  const tb = document.getElementById('touch');
  if (tb && !tb.hidden) {
    const k = ((window.innerHeight <= 420 ? 92 : 109) + 24) / ah;
    BOT = k < 0.9 ? clamp((540 * k - 90) / (1 - k), 0, 260) : 0;
  }
  const need = H + BOT;
  W = Math.round(Math.max(960, need * a)); VH = Math.round(W / a); TOP = VH - need;
  const s = Math.max(0.1, Math.min(aw / W, ah / VH));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width = Math.round(W * s) + 'px';
  canvas.style.height = Math.round(VH * s) + 'px';
  canvas.width = Math.round(W * s * dpr);
  canvas.height = Math.round(VH * s * dpr);
  scaleK = s * dpr;
}
window.addEventListener('resize', resize);

// ---------- Vollbild ----------
const fsBtn = document.getElementById('fs'), fsIcon = document.getElementById('fs-icon');
const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
const fsSupported = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
let pseudoFull = false;
function isFull() { return !!fsElement() || pseudoFull; }
function updateFull() {
  document.body.classList.toggle('full', isFull());
  fsIcon.setAttribute('d', isFull() ? 'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5' : 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');
  fsBtn.setAttribute('aria-label', isFull() ? 'Vollbild beenden' : 'Vollbild');
  requestAnimationFrame(resize);
}
async function toggleFull() {
  try {
    if (fsElement()) { await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen()); return; }
    if (pseudoFull) { pseudoFull = false; updateFull(); return; }
    const el = document.documentElement;
    if (fsSupported) {
      await (el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : el.webkitRequestFullscreen());
      try { await screen.orientation?.lock?.('landscape'); } catch (e) { /* nicht überall erlaubt */ }
      return;
    }
  } catch (e) { /* Vollbild abgelehnt: unten Ersatz nutzen */ }
  pseudoFull = !pseudoFull; updateFull();
}
document.addEventListener('fullscreenchange', updateFull);
document.addEventListener('webkitfullscreenchange', updateFull);
fsBtn.addEventListener('click', e => { e.stopPropagation(); toggleFull(); canvas.focus(); });
fsBtn.addEventListener('pointerdown', e => e.stopPropagation());
resize();

// ---------- Ton ----------
let AC = null, muted = false;
function unlockAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
}
function beep(f, d, type = 'square', vol = 0.06, slide = 0) {
  if (!AC || muted) return;
  try {
    const t0 = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t0 + d);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d + 0.02);
  } catch (e) { /* Ton ist optional */ }
}
const seq = (notes, gap, type = 'square', vol = 0.05) => notes.forEach((f, i) => setTimeout(() => beep(f, 0.16, type, vol), i * gap));
let lastBump = 0;
const sfx = {
  jump: () => beep(480, 0.12, 'square', 0.04, 1.7),
  coin: () => { beep(880, 0.07, 'square', 0.04); setTimeout(() => beep(1320, 0.1, 'square', 0.04), 55); },
  hurt: () => beep(220, 0.3, 'sawtooth', 0.07, 0.35),
  stomp: () => beep(330, 0.13, 'square', 0.06, 0.45),
  punch: () => beep(150, 0.08, 'triangle', 0.09, 0.6),
  hit: () => beep(120, 0.14, 'sawtooth', 0.08, 0.5),
  kick: () => beep(260, 0.1, 'triangle', 0.1, 0.5),
  bump: () => { const n = performance.now(); if (n - lastBump > 90) { lastBump = n; beep(420, 0.05, 'sine', 0.06); } },
  spring: () => beep(260, 0.32, 'sine', 0.08, 3.2),
  boom: () => beep(80, 0.4, 'sawtooth', 0.1, 0.5),
  star: () => beep(1046, 0.09, 'triangle', 0.06, 1.3),
  win: () => seq([523, 659, 784, 1046], 110),
  goal: () => seq([392, 523, 659, 784, 1046], 90),
  lose: () => seq([440, 349, 262], 160, 'triangle', 0.07),
};

// ---------- Eingabe ----------
const input = { l: false, r: false, j: false, a: false, jp: false, ap: false, lp: false, rp: false };
const clearEdges = () => { input.jp = input.ap = input.lp = input.rp = false; };
const KEYS = {
  ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r',
  ArrowUp: 'j', KeyW: 'j', Space: 'j', Enter: 'j',
  KeyX: 'a', KeyJ: 'a', KeyK: 'a', ShiftLeft: 'a', ShiftRight: 'a',
};
function press(k, down) {
  if (down && !input[k]) { input[k + 'p'] = true; }
  input[k] = down;
}
window.addEventListener('keydown', e => {
  unlockAudio();
  if (e.code === 'KeyM') { muted = !muted; return; }
  if (e.code === 'KeyF') { toggleFull(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { if (G.mode === 'play' || G.mode === 'pause') G.mode = G.mode === 'play' ? 'pause' : 'play'; return; }
  const k = KEYS[e.code]; if (!k) return;
  e.preventDefault(); if (!e.repeat) press(k, true);
});
window.addEventListener('keyup', e => { const k = KEYS[e.code]; if (k) { e.preventDefault(); press(k, false); } });
window.addEventListener('blur', () => { input.l = input.r = input.j = input.a = false; });

const touchBox = document.getElementById('touch');
function showTouch() { if (touchBox.hidden) { touchBox.hidden = false; resize(); } }
if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) showTouch();
window.addEventListener('touchstart', showTouch, { once: true, passive: true });
touchBox.querySelectorAll('button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); unlockAudio(); b.setPointerCapture?.(e.pointerId); b.classList.add('on'); press(k, true); };
  const off = e => { e.preventDefault(); b.classList.remove('on'); press(k, false); };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off);
  b.addEventListener('lostpointercapture', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
canvas.addEventListener('pointerdown', () => { unlockAudio(); canvas.focus(); if (G.mode !== 'play') input.jp = true; });

// ---------- Partikel ----------
const parts = [];
function burst(x, y, col, n = 10, spd = 220, grav = 600, size = 5) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = spd * (0.4 + Math.random() * 0.8);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - spd * 0.3, life: 0.5 + Math.random() * 0.4, max: 0.9, col, r: size * (0.6 + Math.random() * 0.7), grav });
  }
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
}
function drawParts(camX) {
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / 0.4, 0, 1);
    ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x - camX, p.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---------- Zeichen-Helfer ----------
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function txt(s, x, y, size, col = '#fff7e6', align = 'center', weight = 700, outline = INK) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (outline) { ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = outline; ctx.strokeText(s, x, y); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function heart(x, y, s, full) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 20, s / 20);
  ctx.beginPath(); ctx.moveTo(0, 6); ctx.bezierCurveTo(-14, -4, -8, -16, 0, -8); ctx.bezierCurveTo(8, -16, 14, -4, 0, 6); ctx.closePath();
  ctx.fillStyle = full ? '#ff4d6d' : 'rgba(43,33,64,.55)'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke();
  if (full) { ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(-5, -6, 2.5, 0, TAU); ctx.fill(); }
  ctx.restore();
}
function starShape(x, y, r, rot, col) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  ctx.closePath(); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke();
}

// Bollo: die Spielfigur, ein runder Gelber mit großen Augen
function drawBollo(x, y, w, h, face, o = {}) {
  const t = o.t || 0;
  const s = clamp(-(o.vy || 0) / 2600, -0.12, 0.14);
  const body = o.body || '#ffd23f', dark = o.dark || '#e89a1c';
  if (o.inv > 0 && Math.floor(o.inv * 14) % 2 === 0) return;
  ctx.save(); ctx.translate(x + w / 2, y + h); ctx.scale(1 - s, 1 + s);
  const R = h * 0.56;
  const walk = o.on && Math.abs(o.vx || 0) > 20 ? Math.sin(t * 18) * 5 : 0;
  ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.fillStyle = dark;
  ctx.beginPath(); ctx.ellipse(-R * 0.45 + walk * 0.4, -3, R * 0.36, R * 0.2, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(R * 0.45 - walk * 0.4, -3, R * 0.36, R * 0.2, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = body; ctx.beginPath(); ctx.arc(0, -R - 4, R, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.ellipse(-R * 0.4, -R * 1.45, R * 0.22, R * 0.13, -0.6, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,100,120,.45)'; ctx.beginPath(); ctx.arc(face * R * 0.62, -R * 0.75, R * 0.16, 0, TAU); ctx.fill();
  const ex = face * R * 0.28, ey = -R * 1.12;
  const dizzy = o.stun > 0;
  for (const dx of [-R * 0.26, R * 0.26]) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(ex + dx, ey, R * 0.2, R * 0.27, 0, 0, TAU); ctx.fill(); ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = INK;
    if (dizzy) { ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ex + dx, ey, R * 0.1, t * 10, t * 10 + 4.5); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(ex + dx + face * R * 0.07, ey + R * 0.03, R * 0.1, 0, TAU); ctx.fill(); }
  }
  if (o.angry) {
    ctx.lineWidth = 3; ctx.beginPath();
    ctx.moveTo(ex - R * 0.45, ey - R * 0.38); ctx.lineTo(ex - R * 0.1, ey - R * 0.25);
    ctx.moveTo(ex + R * 0.45, ey - R * 0.38); ctx.lineTo(ex + R * 0.1, ey - R * 0.25); ctx.stroke();
  }
  ctx.lineWidth = 2.5; ctx.beginPath();
  if (o.hurtFace) ctx.arc(face * R * 0.2, -R * 0.55, R * 0.14, Math.PI * 1.1, Math.PI * 1.9);
  else ctx.arc(face * R * 0.22, -R * 0.72, R * 0.18, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();
  if (o.atk > 0) {
    const fx = face * (R + 14), fy = -R * 0.9;
    ctx.fillStyle = body; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(fx, fy, R * 0.36, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3; ctx.beginPath();
    for (let i = -1; i <= 1; i++) { ctx.moveTo(fx + face * 16, fy + i * 9); ctx.lineTo(fx + face * 28, fy + i * 12); }
    ctx.stroke();
  }
  if (o.kick > 0) {
    ctx.fillStyle = dark; ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(face * (R * 0.9), -6, R * 0.42, R * 0.22, face * -0.4, 0, TAU); ctx.fill(); ctx.stroke();
  }
  if (o.crown) {
    ctx.fillStyle = '#ffd23f'; ctx.lineWidth = 2.5; ctx.beginPath();
    ctx.moveTo(-R * 0.45, -R * 1.85); ctx.lineTo(-R * 0.5, -R * 2.3); ctx.lineTo(-R * 0.2, -R * 2.05); ctx.lineTo(0, -R * 2.4);
    ctx.lineTo(R * 0.2, -R * 2.05); ctx.lineTo(R * 0.5, -R * 2.3); ctx.lineTo(R * 0.45, -R * 1.85); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
  if (dizzy) for (let i = 0; i < 3; i++) { const a = t * 6 + i * TAU / 3; starShape(x + w / 2 + Math.cos(a) * 20, y - 14 + Math.sin(a) * 6, 6, a, '#ffd23f'); }
}

// ---------- Welten ----------
const THEMES = {
  day:    { sky: ['#62c4f5', '#d8f5ff'], sun: '#fff3a8', hillA: '#a5e27a', hillB: '#62bb5a', grass: '#58c43e', dirt: '#9d6539', dirtDark: '#7d4c29', plat: '#e0a55a' },
  sunset: { sky: ['#ff8f6b', '#ffe3a3'], sun: '#fff1c1', hillA: '#f3b56d', hillB: '#cf7448', grass: '#86c64b', dirt: '#8f5733', dirtDark: '#6e3f22', plat: '#f0c070' },
  lagoon: { sky: ['#2f8fae', '#a8eadb'], sun: '#e9fff7', hillA: '#5cc6b1', hillB: '#2c9c8c', grass: '#7bd96a', dirt: '#7a5a3f', dirtDark: '#5b412b', plat: '#d8b77d' },
  dusk:   { sky: ['#5a4bc9', '#f6a8c4'], sun: '#ffe0f0', hillA: '#9b82e3', hillB: '#6a54b8', grass: '#92e27b', dirt: '#6d4a6b', dirtDark: '#4f3350', plat: '#f2b7d0', stars: true },
  night:  { sky: ['#140f30', '#4b2c6f'], sun: '#f5f0d0', hillA: '#3b2a63', hillB: '#291d48', grass: '#5fae6a', dirt: '#4a3657', dirtDark: '#33243f', plat: '#8a76b8', stars: true },
  stadium:{ sky: ['#3e9ee0', '#c4e9ff'], sun: '#fff7c9', hillA: '#9fd3f5', hillB: '#7fbfe8', grass: '#3fb04e', dirt: '#2f8a3c', dirtDark: '#26733a', plat: '#ffffff' },
};

class World {
  constructor(cols) { this.cols = cols; this.g = new Uint8Array(cols * ROWS); this.movers = []; }
  get(c, r) { if (c < 0 || c >= this.cols) return 1; if (r < 0 || r >= ROWS) return 0; return this.g[r * this.cols + c]; }
  set(c, r, v) { if (c >= 0 && c < this.cols && r >= 0 && r < ROWS) this.g[r * this.cols + c] = v; }
  solid(c, r) { const v = this.get(c, r); return v === 1 || v === 2; }
}

function drawSky(th, camX, t) {
  const g = ctx.createLinearGradient(0, -TOP, 0, H); g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(-10, -TOP - 10, W + 20, H + TOP + 20);
  if (th.stars) {
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    for (let i = 0; i < 70; i++) {
      const x = (((i * 137.5 - camX * 0.04) % W) + W) % W, y = (i * 71) % 260;
      const s = (Math.sin(t * 2 + i) + 1.5) * 0.9; ctx.fillRect(x, y, s, s);
    }
  }
  ctx.fillStyle = th.sun; ctx.beginPath(); ctx.arc(W - 180 - camX * 0.02, 105, 44, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (let i = 0; i < 6; i++) {
    const span = W + 320;
    const x = (((i * 270 - camX * 0.12 + t * 9) % span) + span) % span - 160, y = 55 + (i * 53) % 130;

// ---------- Arena (Kampf, Sternenregen, Fußball) ----------
function arenaWorld(plats = true) {
  const w = new World(22);
  for (let c = 0; c < 22; c++) for (let r = 10; r < ROWS; r++) w.set(c, r, 1);
  for (let r = 0; r < ROWS; r++) { w.set(0, r, 1); w.set(21, r, 1); }
  if (plats) for (const c of [4, 5, 6, 15, 16, 17]) w.set(c, 7, 2);
  return w;
}
const ARENA_CAM = 15;
function arenaSides(cam, col) {
  const l = T - cam, r = 21 * T - cam;
  ctx.fillStyle = col; ctx.fillRect(-10, -TOP - 10, l + 10, H + TOP + 20); ctx.fillRect(r, -TOP - 10, W - r + 10, H + TOP + 20);
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(l, -TOP - 10); ctx.lineTo(l, FLOOR); ctx.moveTo(r, -TOP - 10); ctx.lineTo(r, FLOOR); ctx.stroke();
}

// ---------- Szene: Kampf gegen Knurri ----------

// ---------- Szene: Sternenregen ----------
class StarScene {
  get camX() { return ARENA_CAM - (W - 960) / 2; }
  constructor(st) {
    this.world = arenaWorld(false); this.theme = THEMES[st.theme]; this.t = 0;
    this.p = new Player(10 * T, FLOOR - 38); this.items = []; this.got = 0; this.need = 15; this.time = 25; this.spawn = 0.6;
  }
  update(dt) {
    this.t += dt; this.time -= dt; const p = this.p;
    p.update(dt, this.world, input);
    this.spawn -= dt;
    if (this.spawn <= 0) {
      this.spawn = Math.max(0.28, 0.55 - this.t * 0.01);
      const anvilP = Math.min(0.42, 0.2 + this.t * 0.01);
      if (Math.random() < anvilP) this.items.push({ k: 'anvil', x: rand(60, 880), y: -50, vy: 0, w: 52, h: 36, warn: 0.75, land: 0 });
      else this.items.push({ k: Math.random() < 0.1 ? 'big' : 'star', x: rand(70, 920), y: -30, vy: rand(130, 220), ph: rand(0, 6), land: 0 });
    }
    for (const it of this.items) {
      if (it.k === 'anvil') {
        if (it.land > 0) { it.land -= dt; continue; }
        if (it.warn > 0) { it.warn -= dt; continue; }
        it.vy += 1800 * dt; it.y += it.vy * dt;
        if (it.y + it.h >= FLOOR) { it.y = FLOOR - it.h; it.land = 0.6; it.landed = true; G.shake = 5; sfx.boom(); burst(it.x + it.w / 2, FLOOR, '#c9a27a', 8, 200); }
        else if (p.stun <= 0 && overlap(p, it)) {
          p.stun = 1.1; p.vx = 0; this.got = Math.max(0, this.got - 2); sfx.hurt(); G.shake = 8;
          G.toast = { text: '−2 Sterne', t: 1 }; burst(p.cx, p.y, '#ffd23f', 10, 200);
        }
      } else {
        it.y += it.vy * dt; it.x += Math.sin(this.t * 3 + it.ph) * 40 * dt;
        const r = it.k === 'big' ? 36 : 28;
        if (Math.hypot(it.x - p.cx, it.y - p.cy) < r) { it.land = -1; const n = it.k === 'big' ? 3 : 1; this.got += n; addCoin(n); sfx.star(); burst(it.x, it.y, '#ffd23f', 8, 180); }
        else if (it.y > FLOOR - 10) { it.land = -1; burst(it.x, FLOOR - 6, '#fff3a8', 4, 90, 200, 3); }
      }
    }
    this.items = this.items.filter(it => it.k === 'anvil' ? !(it.landed && it.land <= 0) : it.land >= 0);
    if (this.time <= 0) {
      this.time = 0;

      else fail(`Nur ${this.got} von ${this.need} Sternen.`);
    }
  }
  draw() {
    const cam = this.camX, t = this.t;
    drawSky(this.theme, 0, t);
    drawTiles(this.world, this.theme, cam); arenaSides(cam, this.theme.dirtDark);
    for (const it of this.items) {
      if (it.k === 'anvil') {
        const x = it.x - cam;
        if (it.warn > 0 || it.y < FLOOR - 200) {
          const k = it.warn > 0 ? 1 - it.warn / 0.75 : 1;
          ctx.fillStyle = `rgba(43,33,64,${0.15 + 0.3 * k})`; ctx.beginPath(); ctx.ellipse(x + it.w / 2, FLOOR - 3, 16 + 14 * k, 6, 0, 0, TAU); ctx.fill();
          if (it.warn > 0) txt('!', x + it.w / 2, 130, 30, '#ff4d6d');
        }
        if (it.warn <= 0) {
          ctx.fillStyle = '#5b5f73'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(x - 6, it.y); ctx.lineTo(x + it.w + 10, it.y); ctx.lineTo(x + it.w - 4, it.y + 14); ctx.lineTo(x + it.w - 12, it.y + 14);
          ctx.lineTo(x + it.w - 6, it.y + it.h); ctx.lineTo(x + 6, it.y + it.h); ctx.lineTo(x + 12, it.y + 14); ctx.lineTo(x + 4, it.y + 14); ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(x + 2, it.y + 3, it.w - 4, 3);
        }
      } else {
        const r = it.k === 'big' ? 20 : 13;
        ctx.globalAlpha = 0.35; starShape(it.x - cam, it.y - 14, r * 0.6, t, '#fff3a8'); ctx.globalAlpha = 1;

      }

  }

    txt(`${this.got} / ${this.need}`, 470, 44, 30, this.got >= this.need ? '#9ef07a' : '#fff7e6');
    txt(`${Math.ceil(this.time)} s`, 580, 44, 26, this.time < 6 ? '#ff4d6d' : '#fff7e6');
  }
}

// ---------- Szene: Kopfball-Duell ----------
class SoccerScene {
  get camX() { return ARENA_CAM - (W - 960) / 2; }
  constructor(st) {
    this.world = arenaWorld(false);
    for (const c of [1, 2, 19, 20]) this.world.set(c, 6, 2);
    this.theme = THEMES.stadium; this.belowCol = '#2f8a3c'; this.t = 0;
    this.score = [0, 0]; this.time = 60; this.golden = false; this.pause = 0; this.msg = '';
    this.aiInp = { l: false, r: false, j: false, a: false, jp: false, ap: false }; this.aiT = 0;
    this.reset();
  }
  reset() {
    this.p = new Player(6 * T, FLOOR - 46, 44, 46); this.p.jumpV = 860;
    this.ai = new Player(15 * T, FLOOR - 46, 44, 46); this.ai.face = -1; this.ai.speed = SPEED * 0.8; this.ai.jumpV = 820;
    this.ball = { x: 11 * T, y: 160, vx: rand(-60, 60), vy: 0, r: 20, rot: 0 };
  }
  aiThink(dt) {
    const ai = this.ai, b = this.ball, I = this.aiInp;
    this.aiT -= dt; if (this.aiT > 0) return; this.aiT = 0.09;
    let tx;
    const behind = b.x > ai.cx + 8;
    if (b.x < 330 && !behind) tx = 560 + (b.x - 330) * 0.25;
    else tx = behind ? b.x + 70 : b.x + 26 + b.vx * 0.12;
    I.l = tx < ai.cx - 10; I.r = tx > ai.cx + 10;
    const dx = b.x - ai.cx;
    I.j = !ai.on && ai.vy < 0;
    if (Math.abs(dx) < 90 && b.y < ai.y && b.y > ai.y - 220 && ai.on && Math.random() < 0.5) { I.jp = true; I.j = true; }
    if (dx < 10 && dx > -85 && b.y > ai.y - 25 && Math.random() < 0.55) I.ap = true;
  }
  kick(g, dir) {
    const b = this.ball;
    if (g.atk <= 0 || g.kicked) return;
    const dx = (b.x - g.cx) * dir;
    if (dx > -8 && dx < 80 && b.y > g.y - 10 && b.y < g.y + g.h + 26) {
      b.vx = dir * 720 + g.vx * 0.3; b.vy = -520; g.kicked = true; sfx.kick(); burst(b.x, b.y, '#fff', 6, 160);
    }
  }
  head(g) {
    const b = this.ball, R = b.r + g.w / 2;
    const dx = b.x - g.cx, dy = b.y - g.cy, d = Math.hypot(dx, dy);
    if (d >= R || d < 0.01) return;
    const nx = dx / d, ny = dy / d; b.x = g.cx + nx * R; b.y = g.cy + ny * R;
    const rvx = b.vx - g.vx, rvy = b.vy - g.vy, vn = rvx * nx + rvy * ny;
    if (vn < 0) { b.vx -= 1.6 * vn * nx; b.vy -= 1.6 * vn * ny; sfx.bump(); }
    if (ny < -0.5 && b.vy > -320) b.vy = -420;
  }
  bar(rx, ry, rw, rh) {
    const b = this.ball, cx = clamp(b.x, rx, rx + rw), cy = clamp(b.y, ry, ry + rh);
    let dx = b.x - cx, dy = b.y - cy, d = Math.hypot(dx, dy);
    if (d >= b.r) return; if (d < 0.01) { dx = 0; dy = -1; d = 1; }
    const nx = dx / d, ny = dy / d; b.x = cx + nx * b.r; b.y = cy + ny * b.r;
    const vn = b.vx * nx + b.vy * ny; if (vn < 0) { b.vx -= 1.7 * vn * nx; b.vy -= 1.7 * vn * ny; sfx.bump(); }
  }
  update(dt) {
    this.t += dt;
    if (this.pause > 0) {

      if (this.pause <= 0) {
        if (this.score[0] >= 3 || (this.golden && this.score[0] > this.score[1])) { complete(`Sieg ${this.score[0]} : ${this.score[1]}!`); return; }
        if (this.score[1] >= 3 || (this.golden && this.score[1] > this.score[0])) { fail(`Knurri Junior gewinnt ${this.score[1]} : ${this.score[0]}.`); return; }
        this.reset();
      }
      return;
    }
    this.time -= dt;
    if (this.time <= 0) {
      this.time = 0;
      if (this.score[0] > this.score[1]) { complete(`Sieg ${this.score[0]} : ${this.score[1]}!`); return; }
      if (this.score[0] < this.score[1]) { fail(`Knurri Junior gewinnt ${this.score[1]} : ${this.score[0]}.`); return; }
      if (!this.golden) { this.golden = true; G.toast = { text: 'Golden Goal!', t: 2 }; }

    const b = this.ball;
    b.vy += 1500 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vx * dt / b.r;
    this.head(this.p); this.head(this.ai);
    this.kick(this.p, this.p.face); this.kick(this.ai, -1);

    if (b.y + b.r > FLOOR) { b.y = FLOOR - b.r; b.vy = Math.abs(b.vy) > 80 ? -Math.abs(b.vy) * 0.7 : 0; b.vx *= Math.pow(0.6, dt); }
    if (b.y - b.r < 0) { b.y = b.r; b.vy = Math.abs(b.vy) * 0.7; }
    if (b.x - b.r < T) { b.x = T + b.r; b.vx = Math.abs(b.vx) * 0.7; }
    if (b.x + b.r > 21 * T) { b.x = 21 * T - b.r; b.vx = -Math.abs(b.vx) * 0.7; }
    const sp = Math.hypot(b.vx, b.vy); if (sp > 1150) { b.vx *= 1150 / sp; b.vy *= 1150 / sp; }
    if (b.y > 7 * T && b.x + b.r < 3 * T) this.goal(1);

    for (let row = 0; row < 5; row++) for (let i = 0; i < W / 28 + 1; i++) {

    ctx.fillStyle = '#2f8a3c'; ctx.fillRect(0, FLOOR, W, H - FLOOR);
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(495 - cam, 340); ctx.lineTo(495 - cam, FLOOR); ctx.stroke();
    ctx.strokeStyle = INK; ctx.beginPath(); ctx.moveTo(0, FLOOR); ctx.lineTo(W, FLOOR); ctx.stroke();

    ctx.save(); ctx.translate(b.x - cam, b.y); ctx.rotate(b.rot);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, b.r, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK; ctx.beginPath();
    for (let i = 0; i < 5; i++) { const a = i * TAU / 5 - Math.PI / 2; ctx.lineTo(Math.cos(a) * 7, Math.sin(a) * 7); } ctx.closePath(); ctx.fill();
    for (let i = 0; i < 5; i++) { const a = i * TAU / 5 - Math.PI / 2; ctx.beginPath(); ctx.arc(Math.cos(a) * 17, Math.sin(a) * 17, 4, 0, TAU); ctx.fill(); }
    ctx.restore();
    if (this.pause > 0) txt(this.msg, 480, 250, 72, this.msg === 'TOR!' ? '#ffd23f' : '#fff7e6');
  }
  hud() {
    ctx.fillStyle = 'rgba(43,33,64,.75)'; rr(380, 18, 200, 54, 14); ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();

    txt('Bollo', 340, 44, 18, '#ffd23f', 'right');

  }

// ---------- Szene: Wettrennen ----------
const KNURRI = { body: '#b07cff', dark: '#6b3fa0', angry: true };
class RaceScene {
  constructor(st) {
    this.theme = THEMES[st.theme]; this.belowCol = '#d9644a'; this.t = 0; this.len = 2600; this.camX = 0; this.go = 3.6; this.over = false;
    this.p = { x: 120, y: 0, vy: 0, v: 0, stun: 0, last: '', t: 0 };
    this.a = { x: 120, y: 0, vy: 0, v: 0, stun: 0, t: 0 };
    this.hurdles = [];
    for (let x = 560; x < this.len - 220; x += rand(340, 470)) this.hurdles.push({ x, hitP: false, hitA: false, aiOk: Math.random() < 0.8 });
  }
  step(r, dt) {
    r.t += dt; r.vy += GRAV * dt; r.y += r.vy * dt; if (r.y > 0) { r.y = 0; r.vy = 0; }
    r.x += r.v * dt;
  }
  update(dt) {
    this.t += dt; const p = this.p, a = this.a;
    if (this.go > 0) { const before = Math.ceil(this.go); this.go -= dt; if (Math.ceil(this.go) !== before) beep(this.go <= 0 ? 880 : 440, 0.15, 'square', 0.05); return; }
    if (p.stun > 0) p.stun -= dt;
    else {
      const push = () => { p.v = Math.min(560, p.v + 62); if (p.y === 0) burst(p.x + 10, FLOOR, '#f3c1a8', 2, 60, 200, 3); };
      if (input.lp && p.last !== 'l') { push(); p.last = 'l'; }
      if (input.rp && p.last !== 'r') { push(); p.last = 'r'; }
      if (input.ap) p.v = Math.min(560, p.v + 24);
      if (input.jp && p.y === 0) { p.vy = -720; sfx.jump(); }
    }
    p.v = Math.max(0, p.v - (90 + p.v * 0.55) * dt);
    // KI mit Gummiband: bleibt in Reichweite, ist aber nicht unschlagbar
    if (a.stun > 0) a.stun -= dt;
    else {
      const target = clamp(420 + (p.x - a.x) * 0.12, 320, 530);
      a.v += clamp(target - a.v, -400 * dt, 300 * dt);
      const next = this.hurdles.find(h => h.x > a.x + 15);
      if (next && next.aiOk && a.y === 0 && next.x - (a.x + 15) < a.v * 0.3) a.vy = -720;
    }
    this.step(p, dt); this.step(a, dt);
    for (const h of this.hurdles) {
      if (!h.hitP && Math.abs(p.x + 15 - h.x) < 14 && p.y > -34) { h.hitP = true; p.stun = 0.7; p.v = 0; sfx.hurt(); G.shake = 5; burst(h.x, FLOOR - 20, '#fff', 8, 160); }
      if (!h.hitA && Math.abs(a.x + 15 - h.x) < 14 && a.y > -34) { h.hitA = true; a.stun = 0.7; a.v = 0; burst(h.x, FLOOR - 80, '#fff', 8, 160); }
    }
    if (!this.over && p.x >= this.len) { this.over = true; complete('Erster im Ziel!'); burst(this.len, FLOOR - 60, '#ffd23f', 30, 380); }
    else if (!this.over && a.x >= this.len) { this.over = true; fail('Knurri war schneller im Ziel.'); }
    this.camX = clamp(p.x - 260, 0, this.len + 500 - W);
  }
  drawHurdle(x, y, down) {
    ctx.save(); ctx.translate(x, y); if (down) ctx.rotate(0.9);
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.fillStyle = '#fff7e6';
    rr(-10, -36, 4, 36, 2); ctx.fill(); ctx.stroke(); rr(6, -36, 4, 36, 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ff4d6d'; rr(-14, -40, 28, 10, 3); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  draw() {
    const cam = this.camX, t = this.t, p = this.p, a = this.a;
    drawSky(this.theme, cam, t);
    const top = FLOOR - 95;
    ctx.fillStyle = '#d9644a'; ctx.fillRect(-10, top, W + 20, H - top + 10);
    ctx.strokeStyle = '#fff7e6'; ctx.lineWidth = 3; ctx.beginPath();
    for (const y of [top + 8, FLOOR - 45, FLOOR + 12]) { ctx.moveTo(-10, y); ctx.lineTo(W + 10, y); } ctx.stroke();
    ctx.strokeStyle = INK; ctx.beginPath(); ctx.moveTo(-10, top); ctx.lineTo(W + 10, top); ctx.stroke();
    for (let m = 500; m < this.len; m += 500) { const x = m - cam; if (x > -50 && x < W + 50) txt(`${m / 10} m`, x, top - 18, 18, '#fff7e6'); }
    const fx = this.len - cam;
    for (let i = 0; i < 12; i++) { ctx.fillStyle = i % 2 ? INK : '#fff'; ctx.fillRect(fx, top + i * ((H - top) / 12), 14, (H - top) / 12 + 1); }
    ctx.fillStyle = '#fff7e6'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
    rr(fx - 4, top - 150, 8, 150, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffd23f'; rr(fx - 70, top - 160, 140, 40, 10); ctx.fill(); ctx.stroke();
    txt('ZIEL', fx, top - 140, 24, INK, 'center', 700, null);
    for (const h of this.hurdles) { const x = h.x - cam; if (x < -60 || x > W + 60) continue; this.drawHurdle(x, FLOOR - 55, h.hitA); }
    drawBollo(a.x - cam, FLOOR - 55 - 38 + a.y, 30, 38, 1, { ...KNURRI, t: a.t * (0.5 + a.v / 400), vx: a.v, on: a.y === 0, vy: a.vy, stun: a.stun });
    for (const h of this.hurdles) { const x = h.x - cam; if (x < -60 || x > W + 60) continue; this.drawHurdle(x, FLOOR, h.hitP); }

    if (this.go > 0) txt(this.go > 0.6 ? String(Math.ceil(this.go - 0.6)) : 'LOS!', W / 2, 230, 90, '#ffd23f');
  }
  hud() {
    ctx.fillStyle = 'rgba(43,33,64,.55)'; rr(330, 44, 300, 12, 6); ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke();
    drawBollo(318 + 300 * clamp(this.a.x / this.len, 0, 1), 26, 20, 24, 1, KNURRI);
    drawBollo(318 + 300 * clamp(this.p.x / this.len, 0, 1), 30, 20, 24, 1, {});
    if (this.t < 7) txt('← → abwechselnd drücken!', 480, 90, 22, '#ffd23f');
  }
}

// ---------- Szene: Sumo-Schubsen ----------
class SumoScene {
  get camX() { return -(W - 960) / 2; }
  constructor(st) {
    this.theme = THEMES[st.theme]; this.belowCol = '#3aa6c9'; this.t = 0; this.L = 250; this.R = 710; this.SY = 360;
    this.score = [0, 0]; this.pause = 0; this.msg = ''; this.aiT = 0; this.aiDir = 0; this.reset();
  }
  reset() { this.p = this.mk(340, 1); this.a = this.mk(620, -1); this.go = 1.0; this.scored = false; }
  mk(x, face) { return { x, y: this.SY, vx: 0, vy: 0, on: true, face, dash: 0, cd: 0, t: 0, r: 24, splash: false }; }
  body(b, dir, jump, dash, dt) {
    b.t += dt; b.dash -= dt; b.cd -= dt;
    if (dir) b.face = dir;
    if (b.dash <= 0) {
      if (Math.abs(b.vx) <= 270) { const tgt = dir * 260; b.vx += clamp(tgt - b.vx, -1500 * dt, 1500 * dt); }
      else b.vx -= Math.sign(b.vx) * 900 * dt;
    }
    if (jump && b.on) { b.vy = -640; b.on = false; sfx.jump(); }
    if (dash && b.cd <= 0) { b.dash = 0.22; b.cd = 0.85; b.vx = b.face * 640; sfx.punch(); }
    const py = b.y; b.vy += GRAV * dt; b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x >= this.L && b.x <= this.R && b.y >= this.SY && py <= this.SY + 2) { b.y = this.SY; b.vy = 0; b.on = true; } else b.on = false;
    if (!b.splash && b.y > 452) { b.splash = true; sfx.boom(); burst(b.x, 452, '#7bdff2', 22, 320); G.shake = 6; }
  }
  update(dt) {
    this.t += dt; const p = this.p, a = this.a;
    const live = this.pause <= 0 && this.go <= 0;
    if (this.go > 0) this.go -= dt;
    let ad = 0, aj = false, adash = false;
    if (live) {
      this.aiT -= dt;
      if (this.aiT <= 0) {
        this.aiT = 0.12; const to = p.x - a.x;
        this.aiDir = Math.random() < 0.12 ? 0 : Math.sign(to);
        if (a.x < this.L + 50 || a.x > this.R - 50) this.aiDir = Math.sign(480 - a.x);
        if (Math.abs(to) < 160 && Math.random() < 0.35) { adash = true; a.face = Math.sign(to) || a.face; }
        if (p.dash > 0 && Math.abs(to) < 140 && Math.random() < 0.3) aj = true;
      }
      ad = this.aiDir;
    }
    this.body(p, live ? (input.r ? 1 : 0) - (input.l ? 1 : 0) : 0, live && input.jp, live && input.ap, dt);
    this.body(a, ad, aj, adash, dt);
    // Zusammenstoß
    const dx = a.x - p.x, dy = (a.y - a.r) - (p.y - p.r), d = Math.hypot(dx, dy) || 0.01, min = p.r + a.r;
    if (d < min) {
      const nx = dx / d, ny = dy / d, push = (min - d) / 2;
      p.x -= nx * push; a.x += nx * push;
      const rel = (a.vx - p.vx) * nx + (a.vy - p.vy) * ny;
      if (rel < 0) { const j = -rel * 0.7; p.vx -= j * nx; a.vx += j * nx; }
      if (p.dash > 0 && a.dash <= 0) { a.vx = nx * 720; a.vy = -330; p.vx *= 0.2; p.dash = 0; sfx.hit(); G.shake = 8; burst((p.x + a.x) / 2, p.y - 24, '#fff', 10, 220); }
      else if (a.dash > 0 && p.dash <= 0) { p.vx = -nx * 720; p.vy = -330; a.vx *= 0.2; a.dash = 0; sfx.hit(); G.shake = 8; burst((p.x + a.x) / 2, p.y - 24, '#fff', 10, 220); }
      else if (a.dash > 0 && p.dash > 0) { p.vx = -nx * 420; a.vx = nx * 420; p.dash = a.dash = 0; sfx.hit(); }
    }
    if (!this.scored) {
      const pOut = p.y > this.SY + 100, aOut = a.y > this.SY + 100;
      if (pOut || aOut) {
        this.scored = true; this.pause = 1.7;
        if (aOut && !pOut) { this.score[0]++; this.msg = 'Raus mit dir!'; sfx.goal(); addCoin(2); }
        else if (pOut && !aOut) { this.score[1]++; this.msg = 'Platsch!'; sfx.lose(); }
        else this.msg = 'Beide nass!';
      }
    }
    if (this.pause > 0) {
      this.pause -= dt;
      if (this.pause <= 0) {
        if (this.score[0] >= 3) { complete(`Gewonnen ${this.score[0]} : ${this.score[1]}!`); return; }
        if (this.score[1] >= 3) { fail(`Knurri hat dich ${this.score[1]}-mal ins Wasser geschubst.`); return; }
        this.reset();
      }
    }
  }
  draw() {
    const cam = this.camX, t = this.t, L = this.L - cam, R = this.R - cam, SY = this.SY;
    drawSky(this.theme, 0, t);
    // Wasser
    ctx.fillStyle = '#3aa6c9'; ctx.fillRect(-10, 450, W + 20, H - 450 + 10);
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 3; ctx.beginPath();
    for (let x = -10; x <= W + 10; x += 12) ctx.lineTo(x, 450 + Math.sin(x * 0.05 + t * 3) * 4); ctx.stroke();
    // Insel
    ctx.fillStyle = '#8a6a4a'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(L - 12, SY + 30); ctx.lineTo(R + 12, SY + 30); ctx.lineTo(R - 60, 500); ctx.lineTo(L + 60, 500); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f2e2b8'; rr(L - 14, SY, R - L + 28, 34, 12); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#c9a26b'; ctx.lineWidth = 6; ctx.beginPath(); ctx.ellipse((L + R) / 2, SY + 16, (R - L) / 2 - 8, 9, 0, 0, TAU); ctx.stroke();
    for (const [b, o] of [[this.a, KNURRI], [this.p, {}]]) {
      drawBollo(b.x - 21 - cam, b.y - 50, 42, 50, b.face, { ...o, t: b.t, vx: b.vx, vy: b.vy, on: b.on, atk: b.dash > 0 ? 0.1 : 0 });
    }
    if (this.go > 0 && this.pause <= 0) txt('Bereit…', 480 - cam, 230, 60, '#ffd23f');
    if (this.pause > 0) txt(this.msg, 480 - cam, 230, 64, '#ffd23f');
  }
  hud() {
    ctx.fillStyle = 'rgba(43,33,64,.75)'; rr(380, 18, 200, 44, 14); ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
    txt(`${this.score[0]} : ${this.score[1]}`, 480, 40, 30, '#fff7e6');
    txt('Bollo', 360, 40, 18, '#ffd23f', 'right'); txt('Knurri', 600, 40, 18, '#b07cff', 'left');
    if (this.t < 6) txt('X = Rempler · Springen = ausweichen', 480, 90, 20, '#ffd23f');
  }
}

// ---------- Szene: Ballonjagd ----------
const BALLOON_COLS = ['#ff4d6d', '#7bdff2', '#9ef07a', '#ffd23f', '#ff9f1c', '#f7a1ff'];
class BalloonScene {
  get camX() { return ARENA_CAM - (W - 960) / 2; }
  constructor(st) {
    this.world = arenaWorld(true); this.theme = THEMES[st.theme]; this.t = 0;
    this.p = new Player(10 * T, FLOOR - 38); this.items = []; this.got = 0; this.need = 20; this.time = 30; this.spawn = 0.2;
  }
  update(dt) {
    this.t += dt; this.time -= dt; const p = this.p;
    p.update(dt, this.world, input);
    this.spawn -= dt;
    if (this.spawn <= 0) {
      this.spawn = 0.42;
      const bomb = Math.random() < 0.18;
      this.items.push({ x: rand(90, 900), y: FLOOR + 40, vy: -rand(60, 115), ph: rand(0, 6), r: bomb ? 24 : 22, bomb, col: BALLOON_COLS[Math.floor(rand(0, BALLOON_COLS.length))] });
    }
    for (const b of this.items) {
      b.y += b.vy * dt; b.x += Math.sin(this.t * 2 + b.ph) * 28 * dt;
      const box = { x: b.x - b.r, y: b.y - b.r * 1.15, w: b.r * 2, h: b.r * 2.3 };
      if (b.y < FLOOR && (overlap(p, box) || (p.atk > 0 && overlap(fistBox(p), box)))) {
        b.pop = true;
        if (b.bomb) { p.stun = 1; this.got = Math.max(0, this.got - 3); sfx.boom(); G.shake = 10; G.toast = { text: '−3 Ballons', t: 1 }; burst(b.x, b.y, '#3a3550', 16, 280); }
        else { this.got++; addCoin(1); beep(700 + this.got * 20, 0.08, 'square', 0.05, 0.3); burst(b.x, b.y, b.col, 10, 220); }
      }
    }
    this.items = this.items.filter(b => !b.pop && b.y > -60);
    if (this.time <= 0) {
      this.time = 0;
      if (this.got >= this.need) complete(`${this.got} Ballons geplatzt!`);
      else fail(`Nur ${this.got} von ${this.need} Ballons.`);
    }
  }
  draw() {
    const cam = this.camX, t = this.t;
    drawSky(this.theme, 0, t);
    for (const b of this.items) {
      const x = b.x - cam;
      ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, b.y + b.r * 1.1);
      ctx.quadraticCurveTo(x + Math.sin(t * 3 + b.ph) * 8, b.y + b.r * 1.8, x, b.y + b.r * 2.6); ctx.stroke();
      ctx.fillStyle = b.bomb ? '#3a3550' : b.col; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(x, b.y, b.r, b.r * 1.15, 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x - 5, b.y + b.r * 1.22); ctx.lineTo(x + 5, b.y + b.r * 1.22); ctx.lineTo(x, b.y + b.r * 1.08); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.ellipse(x - b.r * 0.4, b.y - b.r * 0.45, b.r * 0.2, b.r * 0.32, -0.5, 0, TAU); ctx.fill();
      if (b.bomb) {
        ctx.strokeStyle = '#ff4d6d'; ctx.lineWidth = 3; ctx.beginPath();
        ctx.moveTo(x - 12, b.y - 8); ctx.lineTo(x - 3, b.y - 4); ctx.moveTo(x + 12, b.y - 8); ctx.lineTo(x + 3, b.y - 4); ctx.stroke();
        ctx.fillStyle = '#ff4d6d'; ctx.beginPath(); ctx.arc(x - 6, b.y + 1, 3, 0, TAU); ctx.arc(x + 6, b.y + 1, 3, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#ffd23f'; ctx.beginPath(); ctx.moveTo(x - 6, b.y + 11); ctx.lineTo(x - 2, b.y + 7); ctx.lineTo(x + 2, b.y + 11); ctx.lineTo(x + 6, b.y + 7); ctx.stroke();
      }
    }
    drawTiles(this.world, this.theme, cam); arenaSides(cam, this.theme.dirtDark);
    this.p.draw(cam);
  }
  hud() {
    ctx.fillStyle = '#ff4d6d'; ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.ellipse(410, 42, 13, 15, 0, 0, TAU); ctx.fill(); ctx.stroke();
    txt(`${this.got} / ${this.need}`, 475, 44, 30, this.got >= this.need ? '#9ef07a' : '#fff7e6');
    txt(`${Math.ceil(this.time)} s`, 585, 44, 26, this.time < 6 ? '#ff4d6d' : '#fff7e6');
    if (this.t < 6) txt('Dunkle Gewitterballons nicht anfassen!', 480, 90, 20, '#ffd23f');
  }
}

// ---------- Szene: Kanonenfeuer ----------
class DodgeScene {
  get camX() { return ARENA_CAM - (W - 960) / 2; }
  constructor(st) {
    this.world = arenaWorld(false); this.theme = THEMES[st.theme]; this.t = 0;
    this.p = new Player(10.5 * T, FLOOR - 38); this.shots = []; this.time = 25; this.shields = 3; this.fireT = 1.2;
    this.cannons = [];
    for (const side of [-1, 1]) for (const lvl of [0, 1]) this.cannons.push({ side, lvl, charge: 0, y: lvl ? FLOOR - 72 : FLOOR - 18 });
  }
  hit(x) {
    const p = this.p; if (p.inv > 0) return;
    this.shields--; p.inv = 1.1; p.vx = (p.cx < x ? -1 : 1) * 300; p.vy = -380; sfx.hurt(); G.shake = 8; burst(p.cx, p.cy, '#7bdff2', 10, 220);
    if (this.shields <= 0) fail('Die Kanonen haben dich erwischt.');
  }
  update(dt) {
    this.t += dt; this.time -= dt; const p = this.p;
    p.update(dt, this.world, input);
    this.fireT -= dt;
    if (this.fireT <= 0) {
      this.fireT = Math.max(0.55, 1.25 - this.t * 0.03);
      const free = this.cannons.filter(c => c.charge <= 0);
      if (free.length) free[Math.floor(rand(0, free.length))].charge = 0.7;
      if (this.t > 8 && Math.random() < 0.25) {
        const side = Math.random() < 0.5 ? -1 : 1;
        this.shots.push({ x: side < 0 ? 2 * T : 20 * T, y: 120, vx: -side * rand(160, 240), vy: 0, r: 16, bounce: true });
      }
    }
    for (const c of this.cannons) if (c.charge > 0) {
      c.charge -= dt;
      if (c.charge <= 0) {
        const x = c.side < 0 ? T + 34 : 21 * T - 34;
        this.shots.push({ x, y: c.y, vx: -c.side * rand(380, 480) * (1 + this.t * 0.012), vy: 0, r: 14 });
        sfx.boom(); burst(x, c.y, '#c9c3d8', 6, 120, 0, 6);
      }
    }
    for (const s of this.shots) {
      if (s.bounce) { s.vy += 1500 * dt; if (s.y + s.r > FLOOR && s.vy > 0) { s.y = FLOOR - s.r; s.vy = -820; } }
      s.x += s.vx * dt; s.y += s.vy * dt;
      const box = { x: s.x - s.r, y: s.y - s.r, w: s.r * 2, h: s.r * 2 };
      if (!s.back && p.atk > 0 && overlap(fistBox(p), box)) { s.back = true; s.vx = -s.vx * 1.2; s.vy = s.bounce ? -500 : 0; sfx.kick(); addCoin(1); burst(s.x, s.y, '#ffd23f', 8, 200); }
      else if (!s.back && overlap(p, { x: box.x + 4, y: box.y + 4, w: box.w - 8, h: box.h - 8 })) this.hit(s.x);
    }
    this.shots = this.shots.filter(s => s.x > T - 40 && s.x < 21 * T + 40 && s.y < H + 50);
    if (this.time <= 0 && G.mode === 'play') { this.time = 0; complete(`Überlebt mit ${this.shields} ${this.shields === 1 ? 'Schild' : 'Schilden'}!`); }
  }
  draw() {
    const cam = this.camX, t = this.t;
    drawSky(this.theme, 0, t);
    drawTiles(this.world, this.theme, cam); arenaSides(cam, this.theme.dirtDark);
    for (const c of this.cannons) {
      const wx = (c.side < 0 ? T : 21 * T) - cam, dir = -c.side;
      ctx.save(); ctx.translate(wx, c.y);
      ctx.fillStyle = c.charge > 0 && Math.floor(c.charge * 12) % 2 ? '#ff4d6d' : '#454a5e'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
      rr(dir > 0 ? 0 : -40, -14, 40, 28, 8); ctx.fill(); ctx.stroke();
      ctx.fillStyle = INK; ctx.beginPath(); ctx.ellipse(dir * 40, 0, 5, 11, 0, 0, TAU); ctx.fill();
      ctx.restore();
      if (c.charge > 0) txt('!', wx + dir * 60, c.y - 30, 30, '#ff4d6d');
    }
    for (const s of this.shots) {
      ctx.fillStyle = s.back ? '#ffd23f' : '#2b2b3a'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(s.x - cam, s.y, s.r, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.beginPath(); ctx.arc(s.x - cam - s.r * 0.35, s.y - s.r * 0.35, s.r * 0.25, 0, TAU); ctx.fill();
    }
    this.p.draw(cam);
  }
  hud() {
    for (let i = 0; i < 3; i++) {
      const x = 400 + i * 36, y = 44;
      ctx.fillStyle = i < this.shields ? '#7bdff2' : 'rgba(43,33,64,.55)'; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(x, y - 14); ctx.lineTo(x + 12, y - 9); ctx.lineTo(x + 10, y + 6); ctx.lineTo(x, y + 14); ctx.lineTo(x - 10, y + 6); ctx.lineTo(x - 12, y - 9); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    txt(`${Math.ceil(this.time)} s`, 560, 44, 26, this.time < 6 ? '#9ef07a' : '#fff7e6');
    if (this.t < 6) txt('Tief: drüberspringen · Hoch: unten bleiben · X: zurückhauen', 480, 90, 20, '#ffd23f');
  }
}

// ---------- Ablauf ----------
const STAGES = [
  { type: 'run', name: 'Wiesenweg', seed: 1, len: 80, diff: 0, theme: 'day' },
  { type: 'fight', name: 'Knurri greift an', theme: 'sunset', boss: { hp: 8, speed: 1 } },
  { type: 'run', name: 'Wackelbrücken', seed: 7, len: 90, diff: 1, theme: 'sunset' },
  { type: 'race', name: 'Hürdenlauf', theme: 'day' },
  { type: 'soccer', name: 'Kopfball-Duell', theme: 'stadium' },
  { type: 'run', name: 'Lagunenpfad', seed: 13, len: 100, diff: 2, theme: 'lagoon' },
  { type: 'sumo', name: 'Sumo-Insel', theme: 'lagoon' },
  { type: 'balloon', name: 'Ballonjagd', theme: 'day' },
  { type: 'run', name: 'Abendhügel', seed: 17, len: 105, diff: 2, theme: 'dusk' },
  { type: 'stars', name: 'Sternenregen', theme: 'dusk' },
  { type: 'dodge', name: 'Kanonenfeuer', theme: 'sunset' },
  { type: 'run', name: 'Wolkenschloss', seed: 21, len: 120, diff: 3, theme: 'night' },
  { type: 'fight', name: 'König Knurri', theme: 'night', boss: { hp: 16, speed: 1.3, king: true } },
];
const INFO = {
  run: { label: 'JUMP & RUN', lines: ['Lauf nach rechts bis zur Zielflagge.', 'Spring Gegnern auf den Kopf, sammle Münzen.', '25 Münzen = ein Extraherz.'] },
  fight: { label: 'KAMPF', lines: ['Hau zu mit X oder spring ihm auf den Kopf.', 'Rennt er gegen die Wand, ist er benommen:', 'dann zählt jeder Treffer doppelt.'] },
  soccer: { label: 'KOPFBALL', lines: ['Schieß 3 Tore ins rechte Tor.', 'X = Schuss, Springen = Kopfball.', '60 Sekunden, bei Gleichstand Golden Goal.'] },
  stars: { label: 'STERNENREGEN', lines: ['Fang 15 Sterne in 25 Sekunden.', 'Große Sterne zählen dreifach.', 'Ambosse kosten 2 Sterne. Achte auf das !'] },
  race: { label: 'WETTRENNEN', lines: ['Drück ← und → immer abwechselnd, so schnell du kannst.', 'Spring über die Hürden.', 'Sei vor Knurri im Ziel!'] },
  sumo: { label: 'SUMO', lines: ['Schubs Knurri 3-mal ins Wasser.', 'X = Rempler nach vorn.', 'Spring über seinen Rempler, dann fliegt er selbst raus.'] },
  balloon: { label: 'BALLONJAGD', lines: ['Lass 20 Ballons in 30 Sekunden platzen.', 'Berühren oder hauen reicht.', 'Dunkle Gewitterballons kosten 3 Punkte!'] },
  dodge: { label: 'KANONENFEUER', lines: ['Überlebe 25 Sekunden.', 'Tiefe Kugeln: drüberspringen. Hohe Kugeln: unten bleiben.', 'Mit X haust du Kugeln zurück. 3 Schilde.'] },
};
const G = { mode: 'title', stage: 0, hearts: 5, coins: 0, scene: null, t: 0, timer: 0, shake: 0, msg: '', toast: null };
function makeScene(st) {
  if (st.type === 'run') return new RunScene(st);
  if (st.type === 'fight') return new FightScene(st);
  if (st.type === 'soccer') return new SoccerScene(st);
  if (st.type === 'race') return new RaceScene(st);
  if (st.type === 'sumo') return new SumoScene(st);
  if (st.type === 'balloon') return new BalloonScene(st);
  if (st.type === 'dodge') return new DodgeScene(st);
  return new StarScene(st);
}
function startStage(i) { G.stage = i; G.scene = makeScene(STAGES[i]); G.mode = 'intro'; G.timer = 0.35; parts.length = 0; }
function complete(msg) { if (G.mode !== 'play') return; G.mode = 'clear'; G.msg = msg; G.timer = 2; sfx.win(); }
function fail(msg) { if (G.mode !== 'play') return; G.mode = 'fail'; G.msg = msg; G.timer = 0.6; sfx.lose(); }
function gameOver() { G.mode = 'gameover'; G.timer = 0.8; sfx.lose(); }

function menuUpdate(dt) {
  G.t += dt; if (G.timer > 0) G.timer -= dt;
  const go = input.jp && G.timer <= 0;
  if (G.mode === 'title' && go) { G.hearts = 5; G.coins = 0; startStage(0); }
  else if (G.mode === 'intro' && go) G.mode = 'play';
  else if (G.mode === 'clear' && G.timer <= 0) { if (G.stage + 1 >= STAGES.length) { G.mode = 'victory'; G.timer = 1; sfx.goal(); } else startStage(G.stage + 1); }
  else if ((G.mode === 'fail' || G.mode === 'gameover') && go) { if (G.hearts <= 0) G.hearts = 5; startStage(G.stage); }
  else if (G.mode === 'victory') { if (Math.random() < 0.4) burst(rand(0, W), -10 - TOP, ['#ffd23f', '#ff4d6d', '#7bdff2', '#9ef07a'][Math.floor(rand(0, 4))], 1, 80, 200, 5); if (go) G.mode = 'title'; }
}

// ---------- Oberflächen ----------
function drawHUD() {
  for (let i = 0; i < Math.max(5, G.hearts); i++) heart(30 + i * 30, 30, 26, i < G.hearts);
  ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.ellipse(30, 64, 10, 11, 0, 0, TAU); ctx.fill(); ctx.stroke();
  txt(`× ${G.coins}`, 46, 65, 20, '#fff7e6', 'left');
  const st = STAGES[G.stage];
  txt(`${G.stage + 1}/${STAGES.length} · ${st.name}`, W - 20, 28, 18, '#fff7e6', 'right');
  for (let i = 0; i < STAGES.length; i++) {
    const x = W - 20 - (STAGES.length - 1 - i) * 20, y = 54;
    ctx.fillStyle = i < G.stage ? '#9ef07a' : i === G.stage ? '#ffd23f' : 'rgba(43,33,64,.55)';
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.beginPath();
    if (STAGES[i].type === 'run') ctx.arc(x, y, 6, 0, TAU); else { ctx.moveTo(x, y - 8); ctx.lineTo(x + 8, y); ctx.lineTo(x, y + 8); ctx.lineTo(x - 8, y); ctx.closePath(); }
    ctx.fill(); ctx.stroke();
  }
  ctx.save(); ctx.translate((W - 960) / 2, 0);
  if (G.scene && G.scene.hud) G.scene.hud();
  if (G.toast) { txt(G.toast.text, 480, 110, 30, '#ffd23f'); }
  ctx.restore();
}
function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(27,21,48,.88)'; rr(x, y, w, h, 22); ctx.fill();
  ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 4; ctx.stroke();
}
const touchMode = () => !touchBox.hidden;
const startHint = () => touchMode() ? 'Tippe zum Starten' : 'Leertaste zum Starten';
function dim(a = 0.45) { ctx.fillStyle = `rgba(27,21,48,${a})`; ctx.fillRect(-W, -VH, W * 3, VH * 3); }

function drawTitle() {
  const t = G.t;
  drawSky(THEMES.day, t * 40, t);
  ctx.fillStyle = THEMES.day.dirt; ctx.fillRect(0, FLOOR, W, H - FLOOR);
  ctx.fillStyle = THEMES.day.grass; ctx.fillRect(0, FLOOR, W, 12);
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, FLOOR); ctx.lineTo(W, FLOOR); ctx.stroke();
  ctx.save(); ctx.translate((W - 960) / 2, 0);
  const hop = Math.abs(Math.sin(t * 3.2)) * 90;
  drawBollo(120, FLOOR - 76 - hop, 60, 76, 1, { t, vy: Math.cos(t * 3.2) * -900, on: hop < 4 });
  drawBollo(770, FLOOR - 90, 76, 90, -1, { body: '#b07cff', dark: '#6b3fa0', angry: true, crown: true });
  ctx.save(); ctx.translate(480, 130); ctx.rotate(-0.04);
  txt('Bollos Reise', 0, 0, 84, '#ffd23f', 'center', 700);
  ctx.restore();
  txt('Hüpfen · Kämpfen · Kicken · Rennen · Schubsen · Ballons', 480, 200, 24, '#fff7e6');
  panel(270, 244, 420, 160);
  txt('← →  laufen', 300, 282, 22, '#fff7e6', 'left', 500, null);
  txt('Leertaste / ↑  springen', 300, 316, 22, '#fff7e6', 'left', 500, null);
  txt('X  hauen · schießen', 300, 350, 22, '#fff7e6', 'left', 500, null);
  txt('F Vollbild · M Ton · P Pause', 660, 380, 16, 'rgba(255,247,230,.7)', 'right', 500, null);
  if (Math.floor(t * 2) % 2 === 0) txt(startHint(), 480, 442, 30, '#ffffff');
  ctx.restore();
}
function drawIntro() {
  const st = STAGES[G.stage], info = INFO[st.type];
  dim(0.5); panel(220, 120, 520, 300);
  txt(`Etappe ${G.stage + 1} von ${STAGES.length}`, 480, 156, 20, 'rgba(255,247,230,.8)', 'center', 500, null);
  txt(info.label, 480, 196, 40, st.type === 'run' ? '#9ef07a' : '#ff9f1c');
  txt(st.name, 480, 242, 30, '#ffd23f');
  info.lines.forEach((l, i) => txt(l, 480, 290 + i * 28, 20, '#fff7e6', 'center', 500, null));
  if (Math.floor(G.t * 2) % 2 === 0) txt(startHint(), 480, 392, 24, '#ffffff');
}
function drawCard(title, sub, col, hint) {
  dim(0.5); panel(250, 170, 460, 200);
  txt(title, 480, 225, 50, col);
  txt(sub, 480, 285, 22, '#fff7e6', 'center', 500, null);
  if (hint && G.timer <= 0) txt(hint, 480, 335, 22, '#ffffff');
}
function drawVictory() {
  dim(0.2); panel(200, 100, 560, 330);
  txt('Geschafft!', 480, 160, 64, '#ffd23f');
  txt('Bollo hat König Knurri besiegt.', 480, 225, 24, '#fff7e6', 'center', 500, null);
  txt(`Münzen gesammelt: ${G.coins}`, 480, 270, 26, '#fff7e6');
  txt(`Herzen übrig: ${G.hearts}`, 480, 308, 22, '#ff8fa3', 'center', 500, null);
  drawBollo(450, 330, 60, 76, 1, { t: G.t, crown: true });
  if (G.timer <= 0 && Math.floor(G.t * 2) % 2 === 0) txt(touchMode() ? 'Tippe für ein neues Spiel' : 'Leertaste für ein neues Spiel', 480, 470, 22, '#ffffff');
}

function fillBelow() {
  const sc = G.mode === 'title' ? null : G.scene;
  if (G.mode === 'victory') ctx.fillStyle = '#1b1530';
  else if (sc instanceof RunScene) {
    const cam = sc.camX, c0 = Math.max(0, Math.floor(cam / T)), c1 = Math.min(sc.world.cols - 1, Math.floor((cam + W) / T));
    for (let c = c0; c <= c1; c++) { ctx.fillStyle = sc.world.get(c, ROWS - 1) === 1 ? sc.theme.dirt : '#1b1530'; ctx.fillRect(c * T - cam, H - 1, T + 0.5, BOT + 12); }
    return;
  } else ctx.fillStyle = (sc && sc.belowCol) || (sc ? sc.theme.dirt : THEMES.day.dirt);
  ctx.fillRect(-10, H - 1, W + 20, BOT + 12);
}
function draw() {
  ctx.setTransform(scaleK, 0, 0, scaleK, 0, 0);
  ctx.fillStyle = '#1b1530'; ctx.fillRect(0, 0, W, VH);
  ctx.save();
  if (G.shake > 0.3) ctx.translate(rand(-G.shake, G.shake), rand(-G.shake, G.shake));
  const ox = (W - 960) / 2, oy = TOP / 2;
  // Spielwelt: unten bündig, oben zusätzlicher Himmel bei höheren Bildschirmen
  ctx.save(); ctx.translate(0, TOP);
  if (G.mode === 'title') drawTitle();
  else if (G.mode === 'victory') drawSky(THEMES.night, G.t * 30, G.t);
  else if (G.scene) G.scene.draw();
  if (BOT > 0) fillBelow();
  if (G.scene && G.mode !== 'title' && G.mode !== 'victory') drawParts(G.scene.camX);
  ctx.restore();
  if (G.mode === 'victory') { ctx.save(); ctx.translate(ox, oy); drawVictory(); ctx.restore(); ctx.save(); ctx.translate(0, TOP); drawParts(0); ctx.restore(); }
  else if (G.mode !== 'title' && G.scene) {
    drawHUD();
    ctx.save(); ctx.translate(ox, oy);
    if (G.mode === 'intro') drawIntro();
    else if (G.mode === 'clear') drawCard('Geschafft!', G.msg, '#9ef07a');
    else if (G.mode === 'fail') drawCard('Knapp daneben', G.msg, '#ff9f1c', touchMode() ? 'Tippen: nochmal' : 'Leertaste: nochmal');
    else if (G.mode === 'gameover') drawCard('Keine Herzen mehr', 'Du startest die Etappe mit 5 Herzen neu.', '#ff4d6d', touchMode() ? 'Tippen: nochmal' : 'Leertaste: nochmal');
    else if (G.mode === 'pause') drawCard('Pause', 'P drücken zum Weiterspielen', '#ffd23f');
    ctx.restore();
  }
  if (portrait && touchMode()) {
    ctx.fillStyle = 'rgba(27,21,48,.85)'; rr(W / 2 - 200, 84, 400, 44, 14); ctx.fill();
    txt('Dreh dein Handy quer für Vollbild', W / 2, 106, 20, '#ffd23f', 'center', 700, null);
  }
  ctx.restore();
}

// ---------- Hauptschleife ----------
const STEP = 1 / 120;
let lastT = performance.now(), accT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (G.mode === 'play') {
    accT += dt;
    while (accT >= STEP) {
      G.scene.update(STEP); clearEdges(); accT -= STEP;
      if (G.mode !== 'play') { accT = 0; break; }
    }
    G.t += dt;
  } else if (G.mode !== 'pause') { menuUpdate(dt); clearEdges(); }
  if (G.mode !== 'pause') updateParts(dt);
  if (G.toast) { G.toast.t -= dt; if (G.toast.t <= 0) G.toast = null; }
  G.shake = Math.max(0, G.shake - dt * 30);
  draw();
  requestAnimationFrame(frame);
}
window.__G = G; window.__startStage = startStage;

window.claude?.hot?.snapshot?.(() => ({ stage: G.stage, hearts: G.hearts, coins: G.coins, started: G.mode !== 'title' && G.mode !== 'victory' }));
function boot(d) {
  if (d && d.started) { G.hearts = d.hearts || 5; G.coins = d.coins || 0; startStage(clamp(d.stage | 0, 0, STAGES.length - 1)); }
  canvas.focus();
  requestAnimationFrame(t => { lastT = t; frame(t); });
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
